<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Viaggio di Halloween &amp; Samhain 2026</title>
<meta name="description" content="Itinerario, audioguide, meteo e aurora del viaggio in Irlanda e Manchester, 29 ottobre - 4 novembre 2026.">
<meta name="theme-color" content="#0E1420">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Samhain 2026">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/cinzeldecorative_bold.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="fonts/imfell_regular.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Sfondo notturno: stelle e foglie che cadono (disegnate da app.js) -->
<div id="cielo" aria-hidden="true"><canvas id="sfondo"></canvas></div>

<!-- Gradienti condivisi dalle illustrazioni inline -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gScena" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090D18"/><stop offset=".55" stop-color="#2A2440"/><stop offset="1" stop-color="#7A3A22"/>
    </linearGradient>
    <radialGradient id="gLuna" cx=".4" cy=".35" r=".8">
      <stop offset="0" stop-color="#FFC77A"/><stop offset=".55" stop-color="#F08A32"/><stop offset="1" stop-color="#C4531A"/>
    </radialGradient>
    <radialGradient id="gAlone" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#F6A04A" stop-opacity=".45"/><stop offset=".45" stop-color="#D9661F" stop-opacity=".2"/><stop offset="1" stop-color="#D9661F" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>

<div id="app">
  <main id="vista" tabindex="-1">
    <div class="caricamento"><span class="caricamento-ruota"></span><p>Apro il viaggio…</p></div>
  </main>
</div>

<!-- Mini-player dell'audioguida: visibile su tutte le schermate mentre una guida e' in lettura -->
<div id="miniplayer" class="miniplayer" hidden></div>

<!-- Barra inferiore -->
<nav id="barra" class="barra" aria-label="Navigazione principale"></nav>

<noscript><p style="position:relative;z-index:5;padding:24px;color:#F1E3C4;font-family:serif;font-size:18px">Per consultare il viaggio serve JavaScript.</p></noscript>

<script type="module" src="js/app.js"></script>
<script>
  // Service worker: la web app funziona offline dopo la prima apertura (il file sw.js sta accanto a questa pagina).
  try {
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        try {
          navigator.serviceWorker.register('./sw.js').catch(function () { /* senza SW si usa solo la rete */ });
        } catch (e) { /* ignorato */ }
      });
    }
  } catch (e) { /* ignorato */ }
</script>
</body>
</html>
